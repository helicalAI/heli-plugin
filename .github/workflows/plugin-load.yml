name: plugin-load

# push is scoped to the long-lived branches: a feature branch with an open PR
# fires both events otherwise, and every run is duplicated.
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  codex-round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - run: npm i -g @openai/codex@0.153.0     # pin — CLI changes shouldn't break your CI

      - name: Round-trip the marketplace and plugin through the Codex loader
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex"
          mkdir -p "$CODEX_HOME"   # codex resolves CODEX_HOME, it does not create it

          # Read the identity from the manifests rather than repeating it here. What this
          # job checks is that the manifests round-trip through the loader, not that the
          # names are any particular string -- a duplicated literal turns a rename into a
          # red build that says nothing about whether the plugin loads.
          expected=$(jq -re .version plugins/helical-platform/.codex-plugin/plugin.json)
          marketplace=$(jq -re .name .agents/plugins/marketplace.json)
          plugin=$(jq -re .name plugins/helical-platform/.codex-plugin/plugin.json)
          echo "manifests declare $plugin@$marketplace at $expected"

          codex plugin marketplace add . --json
          codex plugin add "$plugin@$marketplace"

          # Assert on `installed`: a local marketplace reports `available: []`
          # even on success, so an emptiness check there would pass vacuously.
          codex plugin list --json | tee /dev/stderr | jq -e \
            --arg n "$plugin" --arg v "$expected" \
            '.installed | map(select(.name == $n and .version == $v)) | length == 1' \
            > /dev/null
